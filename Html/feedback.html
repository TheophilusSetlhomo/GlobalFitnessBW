<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feedback</title>

    <link rel="stylesheet" href="../CSS/cool.css">
</head>

<body>

    <header>

        <h1>Feedback</h1>

        <nav>

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact Us</a>
            <a href="shop.html">Shop</a>
            <a href="cart.html">Cart</a>

        </nav>

    </header>

    <main>
        <h2>Share Your Feedback</h2>

        <p>Tell us about your experience with GlobalFitnessBW. Your feedback helps us improve our services.</p>

        <form id="feedback-form" class="contact-form" action="#" method="post">

            <label for="feedback-name">Your Name:</label>
            <input type="text" id="feedback-name" name="feedback_name" required>

            <label for="feedback-email">Your Email:</label>
            <input type="email" id="feedback-email" name="feedback_email" required>

            <label for="feedback-type">Feedback Type:</label>
            <select id="feedback-type" name="feedback_type" required>
                <option value="">Select feedback type</option>
                <option value="Website">Website</option>
                <option value="Membership">Membership</option>
                <option value="Shop products">Shop products</option>
                <option value="Facilities">Facilities</option>
                <option value="General comment">General comment</option>
            </select>

            <label for="feedback-rating">Rating:</label>
            <select id="feedback-rating" name="feedback_rating" required>
                <option value="">Select rating</option>
                <option value="5">5 - Excellent</option>
                <option value="4">4 - Good</option>
                <option value="3">3 - Okay</option>
                <option value="2">2 - Poor</option>
                <option value="1">1 - Very poor</option>
            </select>

            <label for="feedback-message">Message:</label>
            <textarea id="feedback-message" name="feedback_message" rows="5" required></textarea>

            <button type="submit" class="btn">Submit Feedback</button>

        </form>

        <p id="feedback-confirmation" class="signup-message"></p>

        <section class="saved-customer">
            <h2>Saved Feedback</h2>
            <div id="saved-feedback-list">No feedback saved yet.</div>
            <button type="button" class="btn" id="clear-feedback">Clear feedback</button>
        </section>
    </main>

    <footer>

        <p>&copy; GlobalFitnessBW2026</p>

    </footer>

    <script>
        const feedbackForm = document.getElementById("feedback-form");
        const feedbackConfirmation = document.getElementById("feedback-confirmation");
        const savedFeedbackList = document.getElementById("saved-feedback-list");
        const clearFeedback = document.getElementById("clear-feedback");

        function showSavedFeedback() {
            const feedbackEntries = JSON.parse(localStorage.getItem("feedbackEntries")) || [];

            if (feedbackEntries.length === 0) {
                savedFeedbackList.textContent = "No feedback saved yet.";
                return;
            }

            savedFeedbackList.innerHTML = "";

            feedbackEntries.forEach(function(feedback) {
                const feedbackCard = document.createElement("div");
                feedbackCard.className = "feedback-card";
                feedbackCard.innerHTML =
                    "<strong>Name:</strong> " + feedback.name + "<br>" +
                    "<strong>Email:</strong> " + feedback.email + "<br>" +
                    "<strong>Type:</strong> " + feedback.type + "<br>" +
                    "<strong>Rating:</strong> " + feedback.rating + "/5<br>" +
                    "<strong>Message:</strong> " + feedback.message;
                savedFeedbackList.appendChild(feedbackCard);
            });
        }

        feedbackForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const feedbackEntries = JSON.parse(localStorage.getItem("feedbackEntries")) || [];
            const feedback = {
                name: document.getElementById("feedback-name").value,
                email: document.getElementById("feedback-email").value,
                type: document.getElementById("feedback-type").value,
                rating: document.getElementById("feedback-rating").value,
                message: document.getElementById("feedback-message").value
            };

            feedbackEntries.push(feedback);
            localStorage.setItem("feedbackEntries", JSON.stringify(feedbackEntries));
            feedbackConfirmation.textContent = "Thank you for your feedback.";
            feedbackForm.reset();
            showSavedFeedback();
        });

        clearFeedback.addEventListener("click", function() {
            localStorage.removeItem("feedbackEntries");
            feedbackConfirmation.textContent = "Saved feedback has been cleared.";
            showSavedFeedback();
        });

        showSavedFeedback();
    </script>

</body>

</html>
