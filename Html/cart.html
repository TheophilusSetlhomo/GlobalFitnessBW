<!DOCTYPE html> 

<html lang="en"> 

<head> 

    <meta charset="UTF-8"> 

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <title>CART</title> 
 
    <link rel="stylesheet" href="../CSS/cool.css">
</head>

<body> 

    <header> 

        <h1></h1> 

        <nav> 

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact Us</a>
            <a href="registry.html">Sign Up</a>
            <a href="shop.html">Shop</a>
            <a href="cart.html">Cart</a>

        </nav> 

    </header> 

    <main>
        <h2>Your Cart</h2>

        <ul id="cart-items" class="cart-items"></ul>
        <p id="cart-total" class="cart-total"></p>

        <button type="button" class="btn" id="clear-cart">Clear cart</button>
    </main>

<footer> 

        <p>&copy; GlobalFitnessBW2026</p> 

 </footer> 

    <script>
        const cartItems = document.getElementById("cart-items");
        const cartTotal = document.getElementById("cart-total");
        const clearCart = document.getElementById("clear-cart");

        function showCart() {
            const cart = JSON.parse(localStorage.getItem("cart")) || [];
            cartItems.innerHTML = "";

            if (cart.length === 0) {
                cartItems.innerHTML = "<li>Your cart is empty.</li>";
                cartTotal.textContent = "Total: BWP 0";
                return;
            }

            let total = 0;

            cart.forEach(function(item) {
                const listItem = document.createElement("li");
                listItem.textContent = item.name + " - BWP " + item.price;
                cartItems.appendChild(listItem);
                total += item.price;
            });

            cartTotal.textContent = "Total: BWP " + total;
        }

        clearCart.addEventListener("click", function() {
            localStorage.removeItem("cart");
            showCart();
        });

        showCart();
    </script>
 

</body> 

</html>
