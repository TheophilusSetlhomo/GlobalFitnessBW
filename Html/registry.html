<!DOCTYPE html> 

<html lang="en"> 

<head> 

    <meta charset="UTF-8"> 

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <title>Sign Up page</title> 
 
        <link rel="stylesheet" href="../CSS/cool.css">
</head>

<body> 

    <header> 

        <h1>Sign Up</h1> 

        <nav> 

            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="cart.html">Cart</a>

        </nav> 

    </header> 

    <main>
        <h2>Sign up to GlobalFitnessBW</h2>

        <p>Create a customer profile so the site can remember your details when you return.</p>

        <form id="signup-form" class="signup-form" action="#" method="post">

            <label for="fullname">Names:</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="16" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm_password" required>

            <button type="submit" class="btn">Sign Up</button>

        </form>

        <p id="signup-message" class="signup-message"></p>

        <section class="saved-customer">
            <h2>Saved Customer Details</h2>
            <p id="saved-customer-details">No customer details saved yet.</p>
            <button type="button" class="btn" id="clear-customer">Clear saved details</button>
        </section>
    </main>

  <footer> 

        <p>&copy; GlobalFitnessBW2026</p> 

  </footer> 

    <script>
        const signupForm = document.getElementById("signup-form");
        const signupMessage = document.getElementById("signup-message");
        const savedCustomerDetails = document.getElementById("saved-customer-details");
        const clearCustomer = document.getElementById("clear-customer");

        function showSavedCustomer() {
            const customer = JSON.parse(localStorage.getItem("customer"));

            if (!customer) {
                savedCustomerDetails.textContent = "No customer details saved yet.";
                return;
            }

            savedCustomerDetails.innerHTML =
                "<strong>Name:</strong> " + customer.fullname + "<br>" +
                "<strong>Email:</strong> " + customer.email + "<br>" +
                "<strong>Age:</strong> " + customer.age;
        }

        signupForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            if (password !== confirmPassword) {
                signupMessage.textContent = "Passwords do not match.";
                return;
            }

            const customer = {
                fullname: document.getElementById("fullname").value,
                email: document.getElementById("email").value,
                age: document.getElementById("age").value
            };

            localStorage.setItem("customer", JSON.stringify(customer));
            signupMessage.textContent = "Your signup details have been saved.";
            signupForm.reset();
            showSavedCustomer();
        });

        clearCustomer.addEventListener("click", function() {
            localStorage.removeItem("customer");
            signupMessage.textContent = "Saved customer details have been cleared.";
            showSavedCustomer();
        });

        showSavedCustomer();
    </script>
 

</body> 

</html>
